[project]
name = "cs1-harness"
version = "0.1.0"
description = "Headless GPU Cities: Skylines 1 test runs for generated maps"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.scripts]
cs1-harness = "cs1_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs1_harness"]

[tool.ruff]
line-length = 120
