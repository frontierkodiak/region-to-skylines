<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City timelines</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --surface-2: #f2f1ee;
  --line: #e2e0da;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #8a8883;
  --accent: #e63c8c;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 980px; margin: 0 auto; padding: 12px 14px 48px; }
h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 28px 0 6px; }
.sub { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
.tabs { display: flex; gap: 6px; margin: 8px 0 10px; }
.tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; color: var(--text); }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.mapwrap { position: relative; overflow: auto; border-radius: 8px; background: var(--surface-2); -webkit-overflow-scrolling: touch; max-height: 78vh; }
.mapwrap img { display: block; width: 100%; height: auto; image-rendering: auto; }
.mapwrap.zoomed img { width: 260%; }
.controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 10px 0 4px; }
.controls input[type=range] { width: 100%; accent-color: var(--text); }
.controls button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 9px; color: var(--text); }
.controls button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.stamp { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); }
.stamp b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.controls2 { display: flex; justify-content: flex-end; margin: 0 0 6px; }
.controls2 button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 9px; color: var(--text); }
.controls2 button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.change { font-size: 13px; color: var(--text-2); margin: 6px 0 0; min-height: 2.9em; }
.change b { color: var(--text); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.legend i.line { height: 4px; border-radius: 2px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); display: none; font-variant-numeric: tabular-nums; z-index: 2; }
.axis text { fill: var(--text-3); font-size: 11px; }
.axis line, .axis path { stroke: var(--line); }
.label { fill: var(--text-2); font-size: 11px; }
details { margin: 4px 0 0; font-size: 12px; color: var(--text-2); }
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 500; }
.obs { padding-left: 18px; }
.obs li { margin: 0 0 10px; }
.muted { color: var(--text-3); }
#steps a { color: inherit; }
.foot { margin-top: 30px; font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>
<main>
  <h1 id="title">City timelines</h1>
  <p class="sub" id="subtitle"></p>
  <div class="tabs" id="tabs" role="group" aria-label="City"></div>

  <div class="mapwrap" id="mapwrap"><img id="map" alt=""></div>
  <div class="controls">
    <button id="zoom" aria-pressed="false">Zoom</button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Save">
    <button id="changes" aria-pressed="true">Changes</button>
  </div>
  <div class="controls2"><button id="view" aria-pressed="false">Whole map</button></div>
  <div class="stamp" id="stamp"></div>
  <p class="change" id="change"></p>
  <div class="legend" id="legend"></div>

  <h2>Each step</h2>
  <div id="steps"></div>
  <h2>Population</h2>
  <div class="chart" id="pop"></div>
  <h2>Network built, km</h2>
  <div class="chart" id="roads"></div>
  <h2>Zoned land, km²</h2>
  <div class="chart" id="zones"></div>
  <h2>Services</h2>
  <div id="services"></div>
  <h2>What the diffs show</h2>
  <ol class="obs" id="obs"></ol>
  <p class="foot" id="foot"></p>
</main>
<script src="app.js"></script>
</body>
</html>
