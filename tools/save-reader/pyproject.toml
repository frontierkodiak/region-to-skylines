[project]
name = "cs1save"
version = "0.1.0"
description = "Offline reader for Cities: Skylines 1 saves and maps"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
plots = ["pillow>=11", "scipy>=1.14"]

[project.scripts]
cs1save = "cs1save.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs1save"]

[tool.ruff]
line-length = 120
